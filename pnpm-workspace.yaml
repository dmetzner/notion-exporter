# There was a `confirmModulesPurge: false` here, and the reason it is gone matters more than
# the setting did. On a pnpm major bump (corepack pulled 10 -> 11 on 2026-07-22) pnpm decided
# node_modules had to be purged, asked for confirmation, and — with no TTY under launchd —
# aborted with ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY, so the nightly export failed for
# two weeks with a two-week-old export as the only symptom.
#
# pnpm 12 is the Rust rewrite: it has no purge prompt at all (`clean` / `purge` are explicit
# commands now) and it does not recognise the setting, warning on every run that it was
# ignored. An inert guard that reads like a live one is how the two weeks happened, so it is
# deleted rather than kept "just in case" — and the hazard it covered is what the note above
# is for. If this project is ever pinned back to pnpm 11, restore the setting with it.
allowBuilds:
  '@biomejs/biome': true
  esbuild: true
onlyBuiltDependencies:
  - "@biomejs/biome"
  - esbuild
overrides:
  esbuild: '>=0.28.1'
